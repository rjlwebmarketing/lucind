<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-build" content="5.0.0"><title>Lucas Industrial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  /* Lucas Industrial brand palette (same values as the PM app) */
  --brand-black:#000;--brand-page-grey:#F3F3F3;--brand-yellow:#FFDC4B;--brand-gravel:#789696;--brand-turquoise:#55ABAB;--brand-blue:#013CAE;--brand-light-black:#2D2D2D;
  --bg:var(--brand-page-grey);--card:#fff;--panel-2:#EAF0F0;--ink:var(--brand-light-black);--mut:#55696A;--faint:#8B9D9D;--line:#D7E0E0;
  --acc:var(--brand-blue);--accd:#012d85;--bad:#D32F2F;--ok:#1E8449;--radius:10px
}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
a{color:var(--acc)}a:hover{color:var(--accd)}
.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:var(--radius);padding:9px 16px;font-weight:600;cursor:pointer}.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}
input,select{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand-yellow);border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px;font-weight:500}
.center{max-width:360px;margin:12vh auto;padding:0 20px;text-align:center}
.center .logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 14px}
.center .box{text-align:left}
h1{font-size:19px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}.mut{color:var(--mut)}.err{color:var(--bad);margin:8px 0}.okm{color:var(--ok);margin:8px 0}
.center h1,.center h1+.mut{text-align:center}
.top{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;height:50px}
.top img{width:30px;height:30px;object-fit:contain}.top b{font-size:15px}.top small{display:block;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;line-height:1}
.top .sp{flex:1}.top a{color:var(--mut);cursor:pointer;text-decoration:none;font-weight:500}.top a:hover{color:var(--ink)}
#menuBtn{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:5px 10px;cursor:pointer;font-weight:600}
.layout{display:flex;min-height:calc(100vh - 74px)}
.side{width:230px;background:var(--panel-2);border-right:1px solid var(--line);padding:12px 10px;flex-shrink:0}
.side .sec{font-size:11px;text-transform:uppercase;color:var(--faint);margin:16px 8px 4px;letter-spacing:.08em;font-weight:600}
.side a{display:block;padding:8px 12px;border-radius:10px;color:var(--mut);cursor:pointer;text-decoration:none;font-weight:600;font-size:13.5px;margin-bottom:2px}.side a:hover{background:#fff;color:var(--ink)}.side a.on{background:#fff;color:var(--ink);box-shadow:inset 3px 0 0 var(--acc)}
.main{flex:1;padding:24px 28px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:#EAF0F0;font-weight:600}.tag.dis{background:#fde7e5;color:var(--bad)}.tag.act{background:#e0f3e8;color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:7px 14px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--brand-yellow);border-color:var(--brand-yellow)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}.modal .card{max-width:640px;width:100%;max-height:90vh;overflow:auto;margin:0}
.pw{font:15px ui-monospace,Menlo,monospace;background:#FFF8D6;border:1px dashed #b89a1c;padding:10px;border-radius:6px;user-select:all}
/* global menu: always present, left of the logo */
#menuBtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;font-size:19px;line-height:1;padding:0}
#gm{position:fixed;top:50px;left:0;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);box-shadow:4px 0 16px rgba(0,0,0,.12);z-index:60;padding:12px 10px;overflow:auto;display:none}
body.gm-open #gm{display:block}
#gm a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);cursor:pointer;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:2px}#gm a:hover{background:var(--panel-2)}#gm a.on{background:var(--brand-yellow)}
#gm .gsep{height:1px;background:var(--line);margin:8px 4px}#gm .glab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:10px 12px 4px;font-weight:600}
#gfoot{position:fixed;left:0;right:0;bottom:0;height:24px;background:#fff;border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:0 14px;font-size:11px;color:var(--faint);z-index:40}#gfoot #gstat a{cursor:pointer}
#gmShade{position:fixed;inset:50px 0 0 0;z-index:55;display:none}body.gm-open #gmShade{display:block}
body.fullpage .side{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.tiles a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-weight:700}.tiles a small{display:block;font-weight:400;color:var(--mut);margin-top:4px}.tiles a:hover{border-color:var(--brand-blue)}
@media(max-width:760px){.layout{flex-direction:column}.side{width:auto}.main{padding:16px}}
</style></head><body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = null, ME = null;
// "Keep me signed in" keeps the sign-in token in this browser's local storage (up to 30 days); otherwise it lives only until the tab closes.
try{ TOKEN = sessionStorage.getItem('go_token') || localStorage.getItem('go_token'); if(TOKEN) sessionStorage.setItem('go_token', TOKEN); }catch(e){}
const saveTok = (t, remember) => { TOKEN = t; try{
  if(t){ sessionStorage.setItem('go_token', t); if(remember) localStorage.setItem('go_token', t); }
  else { sessionStorage.removeItem('go_token'); localStorage.removeItem('go_token'); }
}catch(e){} };

async function api(method, path, body){
  const r = await fetch(GO_CONFIG.API + '/api' + path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), body: body === undefined ? undefined : JSON.stringify(body) });
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(r.status === 401 && TOKEN && j.error !== 'bad_credentials'){ saveTok(null); ME = null; location.hash = '#/login'; }
  if(!r.ok) throw Object.assign(new Error(j.message || j.error || ('http_' + r.status)), { code: j.error, status: r.status, data: j });
  return j;
}
const MSG = { bad_credentials: 'Email or password is not right.', locked: 'Too many tries. Try again in 15 minutes, or use "Forgot password".', account_disabled: 'This account has been turned off. Ask the Builder.', link_invalid_or_expired: 'That link has expired or was already used. Request a new one.', email_in_use: 'That email already has an account.', username_in_use: 'That username is taken.', bad_username: 'Usernames are 2-39 characters: letters, numbers, dot, dash or underscore, no spaces.', forbidden: 'You do not have access to that.', too_many_requests: 'Too many requests. Wait a few minutes.', wrong_current_password: 'Current password is not right.', last_builder: 'There must always be one active Builder.' };
const say = e => MSG[e.code] || e.message || 'Something went wrong.';

// ---------- routing ----------
const parts = () => { const h = location.hash.replace(/^#\/?/, ''); const [p, q] = h.split('?'); return { path: p || '', q: new URLSearchParams(q || '') }; };
window.addEventListener('hashchange', route);
async function route(){
  const { path, q } = parts();
  if(path === 'reset') return viewReset(q.get('token') || '');
  if(path === 'forgot') return viewForgot();
  if(!TOKEN){ if(path !== 'login') { location.hash = '#/login'; return; } return viewLogin(); }
  if(!ME){ try{ ME = await api('GET', '/auth/me'); }catch(e){ if(!TOKEN) viewLogin(); return; } }
  if(ME.user.mustChangePassword) return viewChange();
  if(path === 'login' || !path) { location.hash = '#/home'; return; }
  shell(path);
}
function plain(html){ document.body.classList.remove('fullpage', 'menu-open'); $('#app').innerHTML = '<div class="center"><img class="logo" src="logo.png" alt="Lucas Industrial"><div class="box">' + html + '</div></div>'; }

// ---------- public views ----------
function viewLogin(){
  plain(`<h1>Lucas Industrial</h1><div class="mut">Sign in</div>
  <label>Username or email</label><input id="em" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <label style="display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13px;color:var(--ink)"><input id="rem" type="checkbox" style="width:auto"> Keep me signed in for 30 days</label><div class="mut" style="font-size:11px;margin:2px 0 0 24px">Only on a device that is yours.</div>
  <div id="m" class="err"></div><button class="btn" id="go" style="width:100%">Sign in</button>
  <p style="text-align:center"><a href="#/forgot">Forgot password?</a></p>`);
  const go = async () => { try{ const r = await api('POST', '/auth/login', { login: $('#em').value, password: $('#pw').value, remember: $('#rem').checked }); saveTok(r.token, $('#rem').checked); ME = null; location.hash = '#/home'; route(); }catch(e){ $('#m').textContent = say(e); } };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if(e.key === 'Enter') go(); };
}
function viewForgot(){
  plain(`<h1>Reset password</h1><div class="mut">Enter your username or work email and we will send a link to the email on file.</div><label>Username or email</label><input id="em" type="text" autocapitalize="none" spellcheck="false">
  <div id="m"></div><button class="btn" id="go" style="width:100%;margin-top:10px">Send link</button><p style="text-align:center"><a href="#/login">Back to sign in</a></p>`);
  $('#go').onclick = async () => { try{ const r = await api('POST', '/auth/forgot', { login: $('#em').value }); $('#m').innerHTML = '<div class="okm">' + esc(r.message) + '</div>'; }catch(e){ $('#m').innerHTML = '<div class="err">' + esc(say(e)) + '</div>'; } };
}
function viewReset(token){
  plain(`<h1>Choose a password</h1><div class="mut">At least 10 characters.</div><label>New password</label><input id="p1" type="password" autocomplete="new-password"><label>Again</label><input id="p2" type="password" autocomplete="new-password">
  <div id="m" class="err"></div><button class="btn" id="go" style="width:100%">Save password</button>`);
  $('#go').onclick = async () => {
    if($('#p1').value !== $('#p2').value) { $('#m').textContent = 'The two passwords do not match.'; return; }
    try{ await api('POST', '/auth/reset', { token, password: $('#p1').value }); saveTok(null); ME = null; plain('<h1>Password saved</h1><p><a href="#/login">Sign in</a></p>'); }catch(e){ $('#m').textContent = say(e); }
  };
}
function viewChange(){
  plain(`<h1>Set your own password</h1><div class="mut">You are using a temporary password. Choose a new one to continue.</div>
  <label>Temporary password</label><input id="cur" type="password"><label>New password (10+ characters)</label><input id="p1" type="password" autocomplete="new-password"><label>Again</label><input id="p2" type="password" autocomplete="new-password">
  <div id="m" class="err"></div><button class="btn" id="go" style="width:100%">Save</button>`);
  $('#go').onclick = async () => {
    if($('#p1').value !== $('#p2').value) { $('#m').textContent = 'The two passwords do not match.'; return; }
    try{ await api('POST', '/auth/change-password', { current: $('#cur').value, password: $('#p1').value }); ME = null; location.hash = '#/home'; route(); }catch(e){ $('#m').textContent = say(e); }
  };
}

// ---------- version, always on screen ----------
const BUILD = (document.querySelector('meta[name=app-build]') || {}).content || '';
let STALE = false;
function paintFooter(){ const v = $('#gver'), st = $('#gstat'); if(!v) return; v.textContent = 'v' + BUILD;
  st.innerHTML = STALE ? '<a style="color:var(--bad)" id="gre">&#9888;&#65039; Update available — click to reload</a>' : '<span style="color:var(--ok)">&#10003; Up to date</span>';
  const re = $('#gre'); if(re) re.onclick = () => location.reload(); }
async function checkBuild(){ try{ const r = await fetch(location.pathname + '?b=' + Date.now(), { cache: 'no-store' }); const t = await r.text(); const m = t.match(/name="app-build" content="([^"]*)"/); if(m && m[1] !== BUILD){ STALE = true; paintFooter(); } }catch(e){} }
setInterval(checkBuild, 5 * 60 * 1000);

// ---------- signed-in shell ----------
// Modules register themselves here: MODULES['pm.dispatch'] = { render(el, ctx) {...} }. The shell only shows panes the person may open.
const MODULES = {};
const menuItem = k => (ME.menu || []).find(m => m.key === k);
const firstPane = m => m.sections[0].panes[0].key;
const DESC = { estimator: 'Estimates, customers and the price book', pm: 'Projects, dispatch, crew, pay apps and close-out', admin: 'People, audit trail, analytics and sensitive data', builder: 'Infrastructure, connections and role templates' };
// Where a menu item goes: Project Manager opens the whole embedded app; the others open their first permitted screen.
const FRAMED = { pm: 'pm/index.html?v=3.5', estimator: 'estimator/index.html?v=1' };   // branches that open as a whole app
// Screens that are one of the PM app's own tool windows, opened on their own from the Builder / Admin menus.
const TOOLS = { 'builder.pmsettings': 'settings', 'builder.devtools': 'devTasks', 'builder.architecture': 'architecture', 'builder.data': 'data', 'admin.requests': 'requests' };
const menuHref = m => FRAMED[m.key] ? '#/' + m.key : '#/' + firstPane(m);
const menuOf = path => FRAMED[path] ? path : (path.split('.')[0] === 'estimator' ? 'estimator' : path.split('.')[0] === 'sensitive' ? 'admin' : path.split('.')[0]);
function shell(path){
  // Short links such as #/admin or #/builder resolve to the first screen this person may open.
  const mi = menuItem(path);
  if(mi && !FRAMED[path]){ location.replace(menuHref(mi)); return; }
  const cur = menuOf(path), curItem = menuItem(cur);
  const gm = (ME.menu || []).map(m => (m.key === 'admin' || m.key === 'builder' ? '' : '') + `<a href="${menuHref(m)}" data-m="${m.key}" class="${cur === m.key && path !== 'home' ? 'on' : ''}">${esc(m.label)}</a>`).join('');
  // Second-level menu for the native sections (Estimator, Admin, Builder). Project Manager brings its own tabs.
  const side = (curItem && !FRAMED[path]) ? curItem.sections.map(sec => `<div class="sec">${esc(sec.label)}</div>` + sec.panes.map(p => `<a href="#/${p.key}" class="${path === p.key ? 'on' : ''}">${esc(p.label)}</a>`).join('')).join('') : '';
  $('#app').innerHTML = `<div class="top"><button id="menuBtn" type="button" class="btn sec" aria-label="Main menu" title="Main menu">&#9776;</button><a href="#/home" style="display:flex;align-items:center;gap:12px;color:inherit" title="Home"><img src="logo.png" alt=""><div><b>Lucas Industrial</b><small>Company platform</small></div></a><span class="sp"></span><span>${esc(ME.user.name)}</span><a id="lo">Sign out</a></div>
  <div id="gmShade"></div><div id="gfoot"><span id="gver"></span><span id="gstat"></span><span>&reg; Lucas Industrial</span></div><nav id="gm" aria-label="Main menu">${gm}</nav>
  <div class="layout">${side ? `<div class="side">${side}</div>` : ''}<div class="main" id="main"></div></div>`;
  paintFooter(); document.body.classList.remove('gm-open'); document.body.classList.toggle('fullpage', !!FRAMED[path]);
  const toggle = () => document.body.classList.toggle('gm-open');
  $('#menuBtn').onclick = toggle; $('#gmShade').onclick = toggle;
  document.querySelectorAll('#gm a').forEach(a => a.addEventListener('click', () => document.body.classList.remove('gm-open')));
  $('#lo').onclick = async () => { try{ await api('POST', '/auth/logout'); }catch(e){} saveTok(null); ME = null; location.hash = '#/login'; };
  const el = $('#main'), level = ME.permissions[path];
  if(path === 'home') return home(el);
  if(FRAMED[path]){
    if(!menuItem(path)) return el.innerHTML = '<div class="card">You do not have access to this section.</div>';
    el.style.padding = '0';
    el.innerHTML = '<iframe id="appFrame" src="' + FRAMED[path] + '" title="' + esc(menuItem(path).label) + '" style="border:0;width:100%;height:calc(100vh - 74px);display:block"></iframe>';
    return;
  }
  if(!level || level === 'none') return el.innerHTML = '<div class="card">You do not have access to this section.</div>';
  if(TOOLS[path]){ el.style.padding = '0'; el.innerHTML = '<iframe id="appFrame" src="pm/index.html?v=3.5&tool=' + TOOLS[path] + '" title="' + esc(allLabel(path)) + '" style="border:0;width:100%;height:calc(100vh - 74px);display:block"></iframe>'; return; }
  if(path === 'admin.users') return adminUsers(el);
  if(path === 'admin.audit') return adminAudit(el);
  if(path === 'builder.settings') return builderSettings(el);
  if(path === 'builder.roles') return builderRoles(el);
  if(MODULES[path]) return MODULES[path].render(el, { api, me: ME, level, esc });
  el.innerHTML = `<div class="card"><h2>${esc(allLabel(path))}</h2><div class="mut">This section is being built. Your access level: <b>${esc(level)}</b>.</div></div>`;
}
function allLabel(path){ for(const m of ME.menu || []) for(const s of m.sections) for(const p of s.panes) if(p.key === path) return p.label; return path; }
function home(el){
  el.innerHTML = `<div class="card"><h2>Welcome, ${esc(ME.user.name.split(' ')[0])}</h2><div class="mut">The menu at the top left is always there. It lists only what you have been given access to.</div></div>` +
    '<div class="tiles">' + (ME.menu || []).map(m => `<a href="${menuHref(m)}">${esc(m.label)}<small>${esc(DESC[m.key] || '')}</small></a>`).join('') + '</div>';
}

// ---------- Users & Access ----------
async function adminUsers(el){
  const canW = ME.permissions['admin.users'] === 'write';
  el.innerHTML = '<div id="tab"></div>'; tabPeople(el.querySelector('#tab'), canW);
}
function modal(html){ const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="card">' + html + '</div>'; document.body.appendChild(m); m.close = () => m.remove(); m.addEventListener('click', e => { if(e.target === m) m.close(); }); return m; }
const when = t => t ? new Date(t).toLocaleString() : '—';

async function tabPeople(el, canW){
  const [u, cat] = await Promise.all([api('GET', '/admin/users'), api('GET', '/admin/catalog')]);
  const roleLabel = k => (cat.roles.find(r => r.key === k) || {}).label || k;
  el.innerHTML = `<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">People</h2>${canW ? '<button class="btn" id="add" style="flex:0">+ Add person</button>' : ''}</div>
  <table><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr>
  ${u.users.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.username || '')}</td><td>${esc(x.email)}</td><td>${esc(roleLabel(x.role))}</td><td><span class="tag ${x.status === 'active' ? 'act' : 'dis'}">${esc(x.status)}</span></td><td>${when(x.lastLoginAt)}</td><td>${canW ? `<button class="btn sec sm" data-id="${x.id}">Manage</button>` : ''}</td></tr>`).join('')}</table></div>`;
  if(!canW) return;
  el.querySelector('#add').onclick = () => addPerson(cat, () => tabPeople(el, canW));
  el.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => managePerson(u.users.find(x => x.id == b.dataset.id), cat, () => tabPeople(el, canW)));
}
function addPerson(cat, done){
  const roles = cat.roles.filter(r => r.key !== 'builder' || ME.user.role === 'builder');
  const m = modal(`<h2>Add person</h2><label>Name</label><input id="n"><label>Work email (used for password resets)</label><input id="e" type="email"><label>Username (what they type to sign in; leave blank to use the part before the @)</label><input id="un" autocapitalize="none" spellcheck="false">
  <label>Role</label><select id="r">${roles.map(r => `<option value="${r.key}">${esc(r.label)}</option>`).join('')}</select>
  <label>How should they get in?</label><select id="md"><option value="invite">Email them a link to choose their own password</option><option value="temp">Give me a temporary password to hand over</option></select>
  <div id="m" class="err"></div><div class="row" style="margin-top:12px"><button class="btn sec" id="x">Cancel</button><button class="btn" id="ok">Add</button></div>`);
  m.querySelector('#x').onclick = m.close;
  m.querySelector('#ok').onclick = async () => {
    try{ const r = await api('POST', '/admin/users', { name: m.querySelector('#n').value, email: m.querySelector('#e').value, username: m.querySelector('#un').value, role: m.querySelector('#r').value, mode: m.querySelector('#md').value });
      if(r.temporaryPassword){ m.querySelector('.card').innerHTML = `<h2>Person added</h2><p>Give them this temporary password. It is shown only once. They will choose their own at first sign-in.</p><div class="pw">${esc(r.temporaryPassword)}</div><div style="margin-top:12px"><button class="btn" id="d">Done</button></div>`; m.querySelector('#d').onclick = () => { m.close(); done(); }; }
      else { m.close(); done(); } }catch(e){ m.querySelector('#m').textContent = say(e); }
  };
}
function managePerson(u, cat, done){
  const isBuilder = ME.user.role === 'builder', ov = u.overrides || {};
  const roles = cat.roles.filter(r => r.key !== 'builder' || isBuilder);
  const grid = cat.sections.filter(s => !s.builderOnly).map(s => `<tr><th colspan="2">${esc(s.label)}</th></tr>` + s.panes.map(p => {
    const locked = (p.key.startsWith('admin.') || p.key.startsWith('sensitive.')) && !isBuilder;
    return `<tr><td>${esc(p.label)}</td><td><select data-k="${p.key}" ${locked || u.role === 'builder' ? 'disabled' : ''}><option value="">Role default</option>${cat.levels.map(l => `<option value="${l}" ${ov[p.key] === l ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`;
  }).join('')).join('');
  const m = modal(`<h2>${esc(u.name)}</h2><div class="mut">${esc(u.username || '')} · ${esc(u.email)} · ${esc(u.status)}</div>
  <div class="row"><div><label>Name</label><input id="n" value="${esc(u.name)}"></div><div><label>Username</label><input id="un" value="${esc(u.username || '')}" autocapitalize="none" spellcheck="false"></div><div><label>Email</label><input id="e" value="${esc(u.email)}"></div><div><label>Role</label><select id="r">${roles.map(r => `<option value="${r.key}" ${u.role === r.key ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></div></div>
  <div style="margin-top:8px"><button class="btn sm" id="sv">Save details</button></div><div id="m"></div><hr>
  <h2 style="font-size:15px">Access for this person only</h2><div class="mut">Leave on "Role default" unless this person needs more or less than their role.</div>
  <table>${grid}</table><div style="margin-top:8px"><button class="btn sm" id="sp" ${u.role === 'builder' ? 'disabled' : ''}>Save access</button></div><hr>
  <div class="row"><button class="btn sec sm" id="tp">Set temporary password</button><button class="btn sec sm" id="em">Email a reset link</button>${u.status === 'active' ? '<button class="btn bad sm" id="dis">Turn off</button>' : '<button class="btn sm" id="en">Turn back on</button>'}</div>
  <div style="margin-top:12px;text-align:right"><button class="btn sec" id="x">Close</button></div>`);
  const msg = (t, ok) => { m.querySelector('#m').innerHTML = `<div class="${ok ? 'okm' : 'err'}">${esc(t)}</div>`; };
  const run = fn => async () => { try{ await fn(); }catch(e){ msg(say(e)); } };
  m.querySelector('#x').onclick = () => { m.close(); done(); };
  m.querySelector('#sv').onclick = run(async () => { await api('PATCH', '/admin/users/' + u.id, { name: m.querySelector('#n').value, username: m.querySelector('#un').value, email: m.querySelector('#e').value, role: m.querySelector('#r').value }); msg('Saved.', true); });
  m.querySelector('#sp').onclick = run(async () => { const perms = {}; m.querySelectorAll('select[data-k]').forEach(s => { if(s.disabled) return; const v = s.value || null; if((ov[s.dataset.k] || null) !== v) perms[s.dataset.k] = v; }); await api('PUT', '/admin/users/' + u.id + '/permissions', { perms }); msg('Access saved.', true); });
  m.querySelector('#tp').onclick = run(async () => { if(!confirm('Set a new temporary password? Their current sessions end.')) return; const r = await api('POST', '/admin/users/' + u.id + '/reset-password', { mode: 'temp' }); m.querySelector('#m').innerHTML = `<div class="okm">Temporary password (shown once):</div><div class="pw">${esc(r.temporaryPassword)}</div>`; });
  m.querySelector('#em').onclick = run(async () => { await api('POST', '/admin/users/' + u.id + '/reset-password', { mode: 'email' }); msg('Link emailed.', true); });
  const d = m.querySelector('#dis'); if(d) d.onclick = run(async () => { if(!confirm('Turn off ' + u.name + '? They are signed out now and cannot sign in. Everything they did stays on record under their name.')) return; await api('POST', '/admin/users/' + u.id + '/disable'); m.close(); done(); });
  const en = m.querySelector('#en'); if(en) en.onclick = run(async () => { await api('POST', '/admin/users/' + u.id + '/enable'); m.close(); done(); });
}
async function builderRoles(el){ el.innerHTML = '<div id="tab"></div>'; return tabRoles(el.querySelector('#tab')); }
async function tabRoles(el){
  const [r, cat] = await Promise.all([api('GET', '/admin/roles'), api('GET', '/admin/catalog')]);
  const isB = ME.user.role === 'builder';
  el.innerHTML = '<div class="card"><h2>Roles &amp; Templates</h2><div class="mut">The starting access for each role. Changing a template changes everyone in that role (their personal exceptions stay).</div><div style="overflow:auto"><table><tr><th>Pane</th>' + r.roles.map(x => `<th>${esc(x.label)}</th>`).join('') + '</tr>' +
    cat.sections.filter(s => !s.builderOnly).map(s => `<tr><th colspan="${r.roles.length + 1}">${esc(s.label)}</th></tr>` + s.panes.map(p => `<tr><td>${esc(p.label)}</td>` + r.roles.map(x => `<td><select data-r="${x.key}" data-k="${p.key}" ${(!isB || x.key === 'builder') ? 'disabled' : ''}>${cat.levels.map(l => `<option ${x.perms[p.key] === l ? 'selected' : ''}>${l}</option>`).join('')}</select></td>`).join('') + '</tr>').join('')).join('') + '</table></div></div>';
  el.querySelectorAll('select[data-r]:not([disabled])').forEach(s => s.onchange = async () => { try{ await api('PUT', '/admin/roles/' + s.dataset.r, { perms: { [s.dataset.k]: s.value } }); }catch(e){ alert(say(e)); } });
}
async function builderSettings(el){
  el.innerHTML = '<div class="card"><h2>Settings &amp; Connections</h2><div class="mut">Loading…</div></div>';
  let sy; try{ sy = await api('GET', '/admin/system'); }catch(e){ el.innerHTML = '<div class="card err">' + esc(say(e)) + '</div>'; return; }
  const yn = (ok, good, bad) => `<span class="tag ${ok ? 'act' : 'dis'}">${esc(ok ? good : bad)}</span>`;
  const up = s => s > 3600 ? Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min' : Math.floor(s / 60) + ' min';
  const u = sy.users || {};
  const row = (k, v) => `<tr><td style="width:240px">${k}</td><td>${v}</td></tr>`;
  el.innerHTML = `<div class="card"><h2>System</h2><table>
    ${row('Database', yn(sy.database.ok, 'Connected', 'Not reachable'))}
    ${row('Server', 'Node ' + esc(sy.node) + ' · up ' + up(sy.uptimeSeconds))}
    ${row('App address', esc(sy.app.appUrl))}
    ${row('People', esc((u.active || 0) + ' active, ' + (u.disabled || 0) + ' turned off'))}</table></div>
  <div class="card"><h2>Email</h2><table>
    ${row('Sending', yn(sy.mail.live, 'Live (' + sy.mail.provider + ')', 'Not sending — mode: ' + sy.mail.provider))}
    ${row('Sender address', esc(sy.mail.from || 'not set'))}
    ${row('Resend key', yn(sy.mail.keySet, 'Set', 'Missing'))}</table>
    <div class="mut" style="margin-top:8px">Until sending is live, invite and reset links are written to the server log instead of emailed. Keys are set in Railway, never here.</div></div>
  <div class="card"><h2>AI</h2><table>${row('Anthropic key', yn(sy.ai.keySet, 'Set', 'Missing'))}</table></div>
  <div class="card"><h2>Google Drive archive</h2><table>
    ${row('Sign-in client', yn(sy.google.oauthConfigured, 'Configured', 'Missing client ID / secret'))}
    ${row('Token encryption key', yn(sy.google.driveKeySet, 'Set', 'Missing'))}
    ${row('Callback base', esc(sy.google.publicBackendUrl || 'not set'))}
    ${row('Connection', '<span id="dst" class="mut">checking…</span>')}</table>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="dc" style="flex:0">Connect Drive</button><button class="btn sec sm" id="dt" style="flex:0">Test</button><button class="btn sec sm" id="dd" style="flex:0">Disconnect</button></div><div id="dm"></div></div>`;
  const pm = (m, p, b) => fetch(GO_CONFIG.API + '/pm/api' + p, { method: m, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN }, body: b ? JSON.stringify(b) : undefined }).then(async r => { const j = await r.json().catch(() => ({})); if(!r.ok) throw Object.assign(new Error(j.error || 'failed'), j); return j; });
  const note = (t, ok) => { $('#dm').innerHTML = `<div class="${ok ? 'okm' : 'err'}">${esc(t)}</div>`; };
  const status = async () => { try{ const r = await pm('GET', '/archive/drive/status'); $('#dst').innerHTML = yn(r.connected, 'Connected' + (r.email ? ' as ' + esc(r.email) : ''), 'Not connected'); }catch(e){ $('#dst').textContent = 'Could not check'; } };
  status();
  $('#dc').onclick = async () => { try{ const r = await pm('POST', '/archive/drive/connect-url', {}); if(r.url) window.open(r.url, '_blank'); else note('No link returned.'); }catch(e){ note(e.message); } };
  $('#dt').onclick = async () => { try{ await pm('POST', '/archive/drive/test', {}); note('Drive responded.', true); }catch(e){ note(e.message); } };
  $('#dd').onclick = async () => { if(!confirm('Disconnect Google Drive? Archiving stops until it is connected again.')) return; try{ await pm('POST', '/archive/drive/disconnect', {}); note('Disconnected.', true); status(); }catch(e){ note(e.message); } };
}
async function adminAudit(el){
  const r = await api('GET', '/admin/audit?limit=200');
  el.innerHTML = '<div class="card"><h2>Audit log</h2><table><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr>' + r.entries.map(e => `<tr><td>${when(e.at)}</td><td>${esc(e.name || 'System')}${e.username ? ' <span class="mut">(' + esc(e.username) + ')</span>' : ''}<div class="mut">${esc(e.email || '')}</div></td><td>${esc(e.action)}</td><td class="mut">${esc(e.detail ? JSON.stringify(e.detail) : '')}</td></tr>`).join('') + '</table></div>';
}
route();
</script></body></html>
