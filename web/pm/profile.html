<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Complete your profile — Lucas Industrial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#F3F3F3; --panel:#FFFFFF; --line:#D7E0E0; --text:#2D2D2D; --dim:#55696A;
    --blue:#013CAE; --yellow:#FFDC4B; --err:#D32F2F; --ok:#1E8449;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; -webkit-text-size-adjust:100%;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 48px;}
  .brand{display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:.06em; font-size:15px; padding:6px 0 14px; border-bottom:3px solid var(--yellow); margin-bottom:20px;}
  .brand img{width:48px; height:48px; object-fit:contain; flex-shrink:0;}
  .brand small{display:block; font-weight:500; letter-spacing:.04em; color:var(--dim); font-size:11px; margin-top:2px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px 20px;}
  h1{font-size:21px; margin:0 0 6px;}
  p.lead{margin:0 0 18px; color:var(--dim); font-size:14px;}
  label.field{display:block; margin-bottom:15px; font-size:13px; font-weight:600;}
  label.field .opt{font-weight:400; color:var(--dim);}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=url],textarea{
    display:block; width:100%; margin-top:6px; padding:11px 12px; font:inherit; font-size:16px; /* 16px stops iOS zoom */
    border:1px solid #B9C7C7; border-radius:4px; background:#fff; color:var(--text);
  }
  textarea{min-height:84px; resize:vertical;}
  input:focus,textarea:focus{outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue);}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .row{grid-template-columns:1fr;} }
  fieldset{border:0; padding:0; margin:0 0 15px;}
  legend{font-size:13px; font-weight:600; padding:0; margin-bottom:8px;}
  .skills{display:flex; flex-wrap:wrap; gap:8px;}
  .skill{display:inline-flex; align-items:center; gap:7px; padding:9px 12px; border:1px solid #B9C7C7; border-radius:20px; font-size:14px; font-weight:500; background:#fff; cursor:pointer; user-select:none;}
  .skill input{width:18px; height:18px; margin:0;}
  .skill:has(input:checked){background:#E8EEFB; border-color:var(--blue);}
  .hint{font-size:12.5px; color:var(--dim); margin-top:5px; font-weight:400;}
  .err{color:var(--err); font-size:13px; margin-top:5px; font-weight:500;}
  .banner{background:#FDECEC; border:1px solid #F3B8B8; color:#8A1C1C; border-radius:4px; padding:10px 12px; font-size:14px; margin-bottom:16px;}
  button.primary{width:100%; padding:14px; font:inherit; font-size:16px; font-weight:700; color:#fff; background:var(--blue); border:0; border-radius:4px; cursor:pointer;}
  button.primary[disabled]{opacity:.6; cursor:default;}
  .never{background:#F6F9F9; border:1px solid var(--line); border-radius:4px; padding:10px 12px; font-size:12.5px; color:var(--dim); margin:4px 0 18px;}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
  .center{text-align:center; padding:12px 4px;}
  .tick{font-size:42px; color:var(--ok); line-height:1;}
  .foot{margin-top:18px; font-size:11.5px; color:var(--dim); text-align:center;}
</style>
</head>

<script>
const BACKEND_URL = ((window.GO_CONFIG && GO_CONFIG.API) || '') + '/pm';
const root = document.getElementById('root');
const token = new URLSearchParams(location.search).get('t') || '';
let kind = 'w2';

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k === 'class') n.className = v;
    else if(k === 'text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c != null) n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
function show(...nodes){ root.replaceChildren(...nodes); window.scrollTo(0, 0); }

function message(title, text, tick){
  show(el('div', { class: 'center' },
    tick ? el('div', { class: 'tick', text: '✓' }) : null,
    el('h1', { text: title }),
    el('p', { class: 'lead', text })));
}

async function api(path, opts){
  const res = await fetch(BACKEND_URL + path, opts);
  let body = {};
  try { body = await res.json(); } catch(e){}
  return { res, body };
}

async function start(){
  if(!token){ return message('This link is missing something', 'Please use the full link you were sent, or ask us to send a new one.'); }
  let out;
  try { out = await api('/api/intake/form?t=' + encodeURIComponent(token)); }
  catch(e){ return message("We couldn't load the form", 'Please check your connection and try again in a moment.'); }
  const { res, body } = out;
  if(res.status === 404) return message("This link isn't valid", 'Please use the full link you were sent, or ask us to send a new one.');
  if(res.status === 410 && body.error === 'link_used') return message('Already received', 'This profile link has already been used — thank you! If something needs to change, just let us know.', true);
  if(res.status === 410) return message('This link has expired', 'Please ask us to send you a new one.');
  if(res.status === 429) return message('Too many tries', 'Please wait a little while and try again.');
  if(!res.ok) return message("We couldn't load the form", 'Please try again in a moment.');
  kind = body.kind;
  render(body.nameHint || '', body.skills || []);
}

function render(nameHint, skills){
  const isSub = kind === 'sub';
  const inputs = {};
  const errs = {};
  function field(key, label, opts){
    opts = opts || {};
    const input = opts.area ? el('textarea', { name: key, maxlength: opts.max || 1000, placeholder: opts.ph || '' })
      : el('input', { name: key, type: opts.type || 'text', maxlength: opts.max || 120, placeholder: opts.ph || '', autocomplete: opts.ac || 'off', inputmode: opts.mode || '' });
    if(opts.value) input.value = opts.value;
    if(opts.min != null){ input.min = opts.min; input.max = opts.maxNum; }
    inputs[key] = input;
    const err = el('div', { class: 'err', hidden: '' });
    errs[key] = err;
    return el('label', { class: 'field' },
      label, opts.optional ? el('span', { class: 'opt', text: ' (optional)' }) : null,
      input, opts.hint ? el('div', { class: 'hint', text: opts.hint }) : null, err);
  }
  const skillBoxes = skills.map(s => {
    const cb = el('input', { type: 'checkbox', value: s });
    return el('label', { class: 'skill' }, cb, s);
  });
  const skillErr = el('div', { class: 'err', hidden: '' });
  const banner = el('div', { class: 'banner', hidden: '' });
  const hp = el('input', { type: 'text', name: 'hp', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' });
  const submit = el('button', { class: 'primary', type: 'submit', text: 'Send my profile' });

  const form = el('form', { novalidate: '' },
    el('h1', { text: isSub ? 'Complete your company profile' : 'Complete your profile' }),
    el('p', { class: 'lead', text: isSub
      ? "Tell us about your company so we can consider you for upcoming work. This takes about 3 minutes."
      : "A few quick details so we can get you set up. This takes about 3 minutes." }),
    banner,
    field('name', isSub ? 'Company name' : 'Your full name', { value: nameHint, ac: isSub ? 'organization' : 'name' }),
    isSub ? field('contactName', 'Main contact person', { optional: true, ac: 'name' }) : null,
    el('div', { class: 'row' },
      field('phone', 'Phone', { type: 'tel', ac: 'tel', mode: 'tel', max: 40 }),
      field('email', 'Email', { type: 'email', ac: 'email', mode: 'email' })),
    isSub ? field('website', 'Website', { optional: true, type: 'text', ph: 'e.g. yourcompany.com', max: 200 }) : null,
    isSub ? field('address', 'Business address', { ac: 'street-address', ph: 'Street, city, state', max: 200, hint: 'Where your crews are based. We use this to match you with nearby jobs.' }) : null,
    isSub ? el('div', { class: 'row' },
      field('teamSize', 'Total team size', { type: 'number', mode: 'numeric', value: '1', min: 1, maxNum: 500 }),
      field('crewsAvailable', 'Crews you could field at once', { type: 'number', mode: 'numeric', value: '1', min: 1, maxNum: 100 })) : null,
    skills.length ? el('fieldset', {}, el('legend', { text: 'What work do you do? (check all that apply)' }), el('div', { class: 'skills' }, skillBoxes), skillErr) : null,
    isSub ? field('docLinks', 'Links to your documents', { optional: true, area: true, max: 400, ph: 'Paste links to your W-9, insurance certificate or licenses if you have them online', hint: "We'll follow up for paperwork separately. Please don't type account or tax ID numbers here." }) : null,
    field('notes', 'Anything else we should know?', { optional: true, area: true }),
    el('div', { class: 'never', text: "Please don't include Social Security numbers, birth dates, bank details or pay rates. We never collect those here." }),
    el('div', { class: 'hp' }, el('label', {}, 'Leave this empty', hp)),
    submit);

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    Object.values(errs).forEach(e => { e.hidden = true; e.textContent = ''; });
    skillErr.hidden = true; banner.hidden = true;
    const data = { hp: hp.value };
    for(const k of Object.keys(inputs)) data[k] = inputs[k].value;
    data.skills = skillBoxes.map(l => l.querySelector('input')).filter(c => c.checked).map(c => c.value);
    if(isSub){ data.teamSize = Number(data.teamSize) || 1; data.crewsAvailable = Number(data.crewsAvailable) || 1; }
    submit.disabled = true; submit.textContent = 'Sending…';
    try {
      const { res, body } = await api('/api/intake/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, data }) });
      if(res.ok) return message('Thank you!', "We've received your profile. You don't need to do anything else.", true);
      if(res.status === 410) return start();
      if(res.status === 400 && body.field){
        const e = body.field === 'skills' ? skillErr : errs[body.field];
        if(e){ e.textContent = body.message || 'Please check this.'; e.hidden = false; }
        else { banner.textContent = body.message || 'Please check what you entered.'; banner.hidden = false; }
        const t = inputs[body.field]; if(t) t.focus();
        else banner.scrollIntoView({ block: 'center' });
      } else if(res.status === 429){
        banner.textContent = 'Too many tries from this connection. Please wait a little while and try again.'; banner.hidden = false;
      } else {
        banner.textContent = "Something went wrong on our end. Please try again in a moment."; banner.hidden = false;
      }
    } catch(e){
      banner.textContent = "We couldn't reach the server. Please check your connection and try again."; banner.hidden = false;
    }
    submit.disabled = false; submit.textContent = 'Send my profile';
  });
  show(form);
}
start();
</script>
</body>
</html>
