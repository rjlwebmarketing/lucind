<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Submit your proposal — Lucas Industrial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{ --bg:#F3F3F3; --panel:#FFFFFF; --line:#D7E0E0; --text:#2D2D2D; --dim:#55696A; --blue:#013CAE; --yellow:#FFDC4B; --err:#D32F2F; --ok:#1E8449; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; -webkit-text-size-adjust:100%;}
  .wrap{max-width:680px; margin:0 auto; padding:20px 16px 48px;}
  .brand{display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:.06em; font-size:15px; padding:6px 0 14px; border-bottom:3px solid var(--yellow); margin-bottom:20px;}
  .brand img{width:48px; height:48px; object-fit:contain; flex-shrink:0;}
  .brand small{display:block; font-weight:500; letter-spacing:.04em; color:var(--dim); font-size:11px; margin-top:2px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px 20px; margin-bottom:16px;}
  h1{font-size:21px; margin:0 0 6px;}
  h2{font-size:16px; margin:0 0 10px;}
  p.lead{margin:0 0 14px; color:var(--dim); font-size:14px;}
  dl.facts{display:grid; grid-template-columns:140px 1fr; gap:6px 12px; margin:0 0 6px; font-size:14px;}
  dl.facts dt{color:var(--dim);} dl.facts dd{margin:0; font-weight:600;}
  @media (max-width:520px){ dl.facts{grid-template-columns:1fr;} dl.facts dt{margin-top:6px;} }
  table{width:100%; border-collapse:collapse; font-size:13.5px; margin:6px 0 4px;}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line);} th{color:var(--dim); font-weight:600; font-size:12px;}
  .scope{white-space:pre-wrap; font-size:14px; background:#F6F9F9; border:1px solid var(--line); border-radius:4px; padding:10px 12px;}
  label.field{display:block; margin-bottom:15px; font-size:13px; font-weight:600;}
  label.field .opt{font-weight:400; color:var(--dim);}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],textarea{
    display:block; width:100%; margin-top:6px; padding:11px 12px; font:inherit; font-size:16px;
    border:1px solid #B9C7C7; border-radius:4px; background:#fff; color:var(--text); }
  textarea{min-height:84px; resize:vertical;}
  input:focus,textarea:focus{outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue);}
  input[disabled],textarea[disabled]{background:#F3F6F6; color:var(--dim);}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .row{grid-template-columns:1fr;} }
  .hint{font-size:12.5px; color:var(--dim); margin-top:5px; font-weight:400;}
  .err{color:var(--err); font-size:13px; margin-top:5px; font-weight:500;}
  .banner{border-radius:4px; padding:10px 12px; font-size:14px; margin-bottom:16px; background:#E8EEFB; border:1px solid #B9C9EE; color:#0B2A6B;}
  .banner.bad{background:#FDECEC; border-color:#F3B8B8; color:#8A1C1C;}
  .banner.good{background:#E9F6EE; border-color:#B5DFC4; color:#15603A;}
  button{font:inherit; font-size:16px; font-weight:700; border-radius:4px; cursor:pointer; padding:13px 16px;}
  button.primary{width:100%; color:#fff; background:var(--blue); border:0;}
  button.alt{width:100%; color:var(--blue); background:#fff; border:1.5px solid var(--blue); margin-top:10px;}
  button.link{background:none; border:0; color:var(--dim); font-size:14px; font-weight:600; text-decoration:underline; padding:10px 0; width:100%; margin-top:6px;}
  button[disabled]{opacity:.6; cursor:default;}
  a.dl{display:inline-block; margin-top:10px; padding:11px 14px; border:1.5px solid var(--blue); border-radius:4px; color:var(--blue); font-weight:700; text-decoration:none; font-size:14px;}
  .never{background:#F6F9F9; border:1px solid var(--line); border-radius:4px; padding:10px 12px; font-size:12.5px; color:var(--dim); margin:4px 0 18px;}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
  .center{text-align:center; padding:12px 4px;}
  .tick{font-size:42px; color:var(--ok); line-height:1;}
  .foot{margin-top:6px; font-size:11.5px; color:var(--dim); text-align:center;}
</style>
</head>

<script>
const BACKEND_URL = ((window.GO_CONFIG && GO_CONFIG.API) || '') + '/pm';
const root = document.getElementById('root');
const token = new URLSearchParams(location.search).get('t') || '';
let info = null;

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k === 'class') n.className = v;
    else if(k === 'text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if(c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
function show(...nodes){ root.replaceChildren(...nodes); window.scrollTo(0, 0); }
function card(...kids){ return el('div', { class: 'card' }, ...kids); }
function message(title, text, tick){
  show(card(el('div', { class: 'center' }, tick ? el('div', { class: 'tick', text: '✓' }) : null, el('h1', { text: title }), el('p', { class: 'lead', text }))));
}
async function api(path, opts){
  const res = await fetch(BACKEND_URL + path, opts);
  let body = {};
  try { body = await res.json(); } catch(e){}
  return { res, body };
}
const post = (path, payload) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: token }, payload)) });

function fmtDay(s){ const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(s || ''); if(!m) return s || ''; return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtDue(s){ if(!s) return ''; const d = new Date(s); if(!isFinite(d)) return s; return d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function fmtWhen(ms){ return new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

async function start(){
  if(!token) return message('This link is missing something', 'Please use the full link in your email, or ask us to send it again.');
  let out;
  try { out = await api('/api/proposals/info?t=' + encodeURIComponent(token)); }
  catch(e){ return message("We couldn't load this page", 'Please check your connection and try again in a moment.'); }
  const { res, body } = out;
  if(res.status === 404) return message("This link isn't valid", 'Please use the full link in your email, or ask us to send it again.');
  if(res.status === 410) return message('This request is no longer open', 'Lucas Industrial has withdrawn this request for proposals. If you think this is a mistake, please contact us.');
  if(res.status === 429) return message('Too many tries', 'Please wait a little while and try again.');
  if(!res.ok) return message("We couldn't load this page", 'Please try again in a moment.');
  info = body;
  render();
}

function detailsCard(){
  const p = info.project;
  const loc = [p.address, [p.city, p.state].filter(Boolean).join(', ')].filter(Boolean).join(' — ');
  const rows = [['Site', loc], ['Proposal due', fmtDue(p.dueAt)], ['Project start', fmtDay(p.plannedStart)], ['Project finish', fmtDay(p.plannedEnd)], ['Crew needed', p.crewNeeded ? String(p.crewNeeded) : ''], ['Skills needed', (p.requiredSkills || []).join(', ')]].filter(r => r[1]);
  return card(
    el('h1', { text: p.name }),
    el('p', { class: 'lead', text: 'Lucas Industrial is asking for your proposal on this project.' }),
    el('dl', { class: 'facts' }, rows.map(r => [el('dt', { text: r[0] }), el('dd', { text: r[1] })])),
    (p.phases || []).length ? el('div', {}, el('h2', { text: 'Phases', style: 'margin-top:14px;' }),
      el('table', {}, el('thead', {}, el('tr', {}, ['Phase', 'Start', 'Finish', 'Skills'].map(h => el('th', { text: h })))),
        el('tbody', {}, p.phases.map(ph => el('tr', {}, el('td', { text: 'Phase ' + ph.number }), el('td', { text: fmtDay(ph.plannedStart) || 'TBD' }), el('td', { text: fmtDay(ph.plannedEnd) || 'TBD' }), el('td', { text: (ph.requiredSkills || []).join(', ') })))))) : null,
    el('h2', { text: 'Scope of work', style: 'margin-top:14px;' }),
    p.scope && p.scope.trim() ? el('div', { class: 'scope', text: p.scope.trim() }) : el('p', { class: 'lead', text: 'A detailed scope has not been added yet. Use the information above, and contact us with any questions.' }),
    el('a', { class: 'dl', href: BACKEND_URL + '/api/proposals/pdf?t=' + encodeURIComponent(token), target: '_blank', rel: 'noopener', text: '⬇ Download project details (PDF)' }));
}

function render(){
  const p = info.project, mine = info.mine, closed = info.closed;
  const saved = mine ? (mine.data.draft || (mine.status === 'draft' ? mine.data : null) || (mine.status === 'submitted' ? mine.data : null)) : null;
  const d = saved || {};
  const sentData = mine && mine.status === 'submitted' ? mine.data : null;
  const parts = [];

  if(mine && mine.status === 'submitted') parts.push(el('div', { class: 'banner good', text: '✓ Your proposal was sent on ' + fmtWhen(mine.submittedAt) + '. You can change it and send it again until the deadline.' }));
  else if(mine && mine.status === 'declined') parts.push(el('div', { class: 'banner', text: 'You told us you are not able to bid on this project. If that changes, you can still send a proposal below' + (closed ? '' : '.') }));
  else if(mine && mine.status === 'draft') parts.push(el('div', { class: 'banner', text: 'Your draft was saved ' + fmtWhen(mine.updatedAt) + '. Nothing has been sent to us yet.' }));
  else if(info.pastDue && !closed) parts.push(el('div', { class: 'banner bad', text: 'The deadline has passed. You can still send your proposal for a short time, but please contact us first.' }));
  if(mine && mine.data && mine.data.draft && mine.status !== 'draft') parts.push(el('div', { class: 'banner', text: 'Showing your unsent changes. The proposal we have on file is the one sent ' + fmtWhen(mine.submittedAt) + '.' }));

  parts.push(detailsCard());

  if(closed){
    const why = { past_due: 'The deadline for this request has passed, so we are no longer taking changes here.', awarded: 'This project has been awarded.', project_done: 'This project is complete.' }[closed] || 'This request is closed.';
    parts.push(card(el('h2', { text: 'Closed' }), el('p', { class: 'lead', text: why + ' If you need anything, please contact Lucas Industrial.' })));
    return show(...parts);
  }

  // ---- the proposal form ----
  const inputs = {}, errs = {};
  const field = (key, label, o) => {
    o = o || {};
    const input = o.area ? el('textarea', { name: key, maxlength: o.max || 2000, placeholder: o.ph || '' })
      : el('input', { name: key, type: o.type || 'text', maxlength: o.max || 120, placeholder: o.ph || '', autocomplete: o.ac || 'off', inputmode: o.mode || '' });
    const val = o.value !== undefined ? o.value : (d[key] || '');
    input.value = val;
    inputs[key] = input;
    const err = el('div', { class: 'err', hidden: '' }); errs[key] = err;
    return el('label', { class: 'field' }, label, o.optional ? el('span', { class: 'opt', text: ' (optional)' }) : null, input, o.hint ? el('div', { class: 'hint', text: o.hint }) : null, err);
  };
  const priceOf = ph => { const r = (d.prices || []).find(x => (x.phaseId || '') === ph); return r ? String(r.price) : ''; };
  const priceInputs = [];
  const priceRow = (phaseId, label, hint) => {
    const input = el('input', { type: 'text', inputmode: 'decimal', placeholder: '$', autocomplete: 'off', maxlength: '20' });
    input.value = priceOf(phaseId);
    priceInputs.push({ phaseId, input });
    return el('label', { class: 'field' }, label, input, hint ? el('div', { class: 'hint', text: hint }) : null);
  };
  const priceErr = el('div', { class: 'err', hidden: '' });
  const banner = el('div', { class: 'banner bad', hidden: '' });
  const okNote = el('div', { class: 'banner good', hidden: '' });
  const hp = el('input', { type: 'text', name: 'hp', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' });
  const submit = el('button', { class: 'primary', type: 'submit', text: sentData ? 'Send updated proposal' : 'Send my proposal' });
  const draftBtn = el('button', { class: 'alt', type: 'button', text: 'Save draft & finish later' });
  const declineBtn = el('button', { class: 'link', type: 'button', text: mine && mine.status === 'declined' ? 'Update my note' : "We can't bid on this project" });
  const phases = p.phases || [];

  const form = el('form', { novalidate: '' },
    el('h2', { text: 'Your proposal' }),
    el('p', { class: 'lead', text: 'Take your time. Save a draft and come back to this same link whenever you like; nothing is sent to us until you press “Send my proposal”.' }),
    banner, okNote,
    el('div', { class: 'row' }, field('contactName', 'Your name', { ac: 'name' }), field('phone', 'Phone', { type: 'tel', ac: 'tel', mode: 'tel', max: 40 })),
    field('email', 'Email', { type: 'email', ac: 'email', mode: 'email' }),
    el('h2', { text: 'Price', style: 'margin-top:6px;' }),
    phases.length ? [phases.map(ph => priceRow(ph.id, 'Phase ' + ph.number + ' price ($)')), priceRow('', 'Or: one price for the whole project ($)', 'Fill in per-phase prices, or one price for everything, or both.')] : priceRow('', 'Total price ($)'),
    priceErr,
    field('included', 'What is included', { area: true, optional: true }),
    field('excluded', 'What is excluded', { area: true, optional: true }),
    field('notes', 'Anything else we should know?', { area: true, optional: true }),
    el('div', { class: 'never', text: 'Please don’t include Social Security numbers, bank details or tax ID numbers here.' }),
    el('div', { class: 'hp' }, el('label', {}, 'Leave this empty', hp)),
    submit, draftBtn, declineBtn);

  const collect = () => {
    const data = { hp: hp.value };
    for(const k of Object.keys(inputs)) data[k] = inputs[k].value;
    data.prices = priceInputs.map(x => ({ phaseId: x.phaseId, price: x.input.value.trim() })).filter(x => x.price !== '');
    return data;
  };
  const clearErrs = () => { Object.values(errs).forEach(e => { e.hidden = true; e.textContent = ''; }); priceErr.hidden = true; banner.hidden = true; okNote.hidden = true; };
  const showErr = (res, body) => {
    if(res.status === 400 && body.field){
      const e = body.field === 'prices' ? priceErr : errs[body.field];
      if(e){ e.textContent = body.message || 'Please check this.'; e.hidden = false; (inputs[body.field] || e).scrollIntoView && (inputs[body.field] || e).scrollIntoView({ block: 'center' }); }
      else { banner.textContent = body.message || 'Please check what you entered.'; banner.hidden = false; }
    } else if(res.status === 410){ start(); return; }
    else if(res.status === 429) { banner.textContent = 'Too many tries from this connection. Please wait a little while and try again.'; banner.hidden = false; }
    else { banner.textContent = 'Something went wrong on our end. Please try again in a moment.'; banner.hidden = false; }
  };
  const busy = (b, on, label) => { [submit, draftBtn, declineBtn].forEach(x => x.disabled = on); if(on){ b.dataset.label = b.textContent; b.textContent = label; } else if(b.dataset.label){ b.textContent = b.dataset.label; } };
  const run = async (btn, busyLabel, fn) => {
    clearErrs(); busy(btn, true, busyLabel);
    try { await fn(); } catch(e){ banner.textContent = "We couldn't reach the server. Please check your connection and try again."; banner.hidden = false; }
    if(document.body.contains(btn)) busy(btn, false, busyLabel);
  };

  form.addEventListener('submit', ev => { ev.preventDefault(); run(submit, 'Sending…', async () => {
    const { res, body } = await post('/api/proposals/submit', { data: collect() });
    if(res.ok){ message('Thank you!', 'Your proposal was sent to Lucas Industrial. You can reopen this same link to change it or send an updated one until the deadline.', true); return; }
    showErr(res, body);
  }); });
  draftBtn.addEventListener('click', () => run(draftBtn, 'Saving…', async () => {
    const { res, body } = await post('/api/proposals/save', { data: collect() });
    if(res.ok){ okNote.textContent = '✓ Draft saved. Come back to this same link any time.'; okNote.hidden = false; okNote.scrollIntoView({ block: 'center' }); return; }
    showErr(res, body);
  }));
  declineBtn.addEventListener('click', () => {
    const reason = el('textarea', { maxlength: '1000', placeholder: 'Optional: a short reason (schedule, location, scope…)' });
    reason.value = mine && mine.status === 'declined' ? (mine.data.reason || '') : '';
    const err = el('div', { class: 'err', hidden: '' });
    const go = el('button', { class: 'primary', type: 'button', text: 'Send: we can’t bid' });
    const back = el('button', { class: 'link', type: 'button', text: 'Back to my proposal' });
    go.addEventListener('click', async () => { go.disabled = true; try {
      const { res, body } = await post('/api/proposals/decline', { reason: reason.value });
      if(res.ok) return message('Thanks for letting us know', 'We have noted that you can’t bid on this project. If anything changes, reopen this same link and send a proposal before the deadline.', true);
      if(res.status === 410) return start();
      err.textContent = body.message || 'Something went wrong. Please try again.'; err.hidden = false;
    } catch(e){ err.textContent = 'We couldn’t reach the server. Please try again.'; err.hidden = false; } go.disabled = false; });
    back.addEventListener('click', () => render());
    show(card(el('h1', { text: 'Not able to bid?' }), el('p', { class: 'lead', text: 'No problem — just let us know so we can plan around it. You can change your mind later with this same link.' }), reason, err, el('div', { style: 'height:12px;' }), go, back));
  });

  parts.push(card(form));
  show(...parts);
}
start();
</script>
</body>
</html>
